# References:
# https://github.com/linuxserver/docker-sonarr
# https://github.com/linuxserver/docker-radarr
# https://github.com/linuxserver/docker-lidarr
# https://github.com/linuxserver/docker-prowlarr
# https://github.com/qdm12/gluetun-wiki/
# https://hub.docker.com/r/linuxserver/qbittorrent/

---
services:
  sonarr:  # tv series downloader
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/iurii/docker/torrenting/sonarr-config:/config
      - /mnt/data/jellyfin/tv:/tv
      - /mnt/data/jellyfin/downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http://localhost:8989 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: "container:gluetun"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  radarr:  # movies downloader
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/iurii/docker/torrenting/radarr-config:/config
      - /mnt/data/jellyfin/movies:/movies
      - /mnt/data/jellyfin/downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http://localhost:7878 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: "container:gluetun"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  lidarr:  # music downloader
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/iurii/docker/torrenting/lidarr-config:/config
      - /mnt/data/jellyfin/music:/music
      - /mnt/data/jellyfin/downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http://localhost:8686 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: "container:gluetun"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  prowlarr:  # indexer manager
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/iurii/docker/torrenting/prowlarr-config:/config
    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http://localhost:9696 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: "container:gluetun"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=America/Chicago
    network_mode: "container:gluetun"
    volumes:
      - /home/iurii/docker/torrenting/qbittorrent-config:/config
      - /mnt/data/jellyfin/downloads:/downloads
      - /mnt/data/wiki:/wiki
    healthcheck:
      test: ["CMD-SHELL","curl http://localhost:8085 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  shared:
    external: true
