---
# Reference: https://docker-compose.de/en/portainer/

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=America/Chicago
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:9000:9000"
    volumes:
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
      - /var/run/docker.sock:/var/run/docker-root.sock:ro
      - /home/iurii/docker/portainer/portainer_data:/data
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s