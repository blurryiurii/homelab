---
# https://www.home-assistant.io/installation/linux

services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    environment:
      - TZ=America/Chicago
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/iurii/docker/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
    - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homeassistant

# https://github.com/linuxserver/docker-faster-whisper
# https://github.com/openai/whisper
  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WHISPER_MODEL=turbo # large-v3-turbo   # turbo
#       - LOCAL_ONLY= #optional
#       - WHISPER_BEAM=1 #optional
      - WHISPER_LANG=en #optional
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /home/iurii/docker/homeassistant/whisper-data:/config
    ports:
      - 127.0.0.1:10300:10300
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    networks:
      - homeassistant

  piper:
    image: lscr.io/linuxserver/piper:latest
    container_name: piper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PIPER_VOICE=en_US-lessac-medium
      - PIPER_LENGTH=1.1 #optional
      - PIPER_NOISE=0.667 #optional
      - PIPER_NOISEW=0.333 #optional
      - PIPER_SPEAKER=0 #optional
      - NO_STREAMING= #optional
    volumes:
      - /home/iurii/docker/homeassistant/piper-data:/config
    ports:
      - 127.0.0.1:10200:10200
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - homeassistant

networks:
  homeassistant:
