---
# Reference:
# https://github.com/tomsquest/docker-radicale/blob/master/docker-compose.yml

services:
  radicale:
    image: tomsquest/docker-radicale
    container_name: radicale
    ports:
      - 127.0.0.1:5232:5232
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 50
    healthcheck:
      test: curl -f http://127.0.0.1:5232 || exit 1
      interval: 30s
      retries: 3
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - /home/iurii/docker/radicale/data:/data
    networks:
      - shared

networks:
  shared:
    external: true