---
# Reference: https://github.com/louislam/uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=America/Chicago
    volumes:
      - /home/iurii/docker/uptime-kuma/config:/app/data
      - /run/user/1000/docker.sock:/var/run/docker.sock:ro
      # also the root docker
      - /var/run/docker.sock:/var/run/root-docker.sock:ro
    ports:
      - 127.0.0.1:3001:3001
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"