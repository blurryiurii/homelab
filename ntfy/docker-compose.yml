---
# https://docs.ntfy.sh/install/

services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=America/Chicago
    user: 1000:1000 # optional: replace with your own user/group or uid/gid
    volumes:
      - /home/iurii/docker/ntfy/cache:/var/cache/ntfy
      - /home/iurii/docker/ntfy/data:/etc/ntfy
    ports:
      - 127.0.0.1:3002:80
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true # needed, if healthcheck is used. Prevents zombie processes
    networks:
      - shared

networks:
  shared:
    external: true
