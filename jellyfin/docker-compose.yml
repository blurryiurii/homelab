services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    ports:
      - "127.0.0.1:8096:8096/tcp"  # http
      # - "8920:8920/tcp"  # https
    volumes:
      - /home/iurii/docker/jellyfin/config:/config
      - /home/iurii/docker/jellyfin/cache:/cache
      - type: bind
        source: /mnt/data/jellyfin
        target: /media
        read_only: true
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - shared

networks:
  shared:
    external: true