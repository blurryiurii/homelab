---
# Reference: https://jellyfin.org/docs/general/installation/container/

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - TZ=America/Chicago
    ports:
      - "127.0.0.1:8096:8096/tcp"  # http
      # - "8920:8920/tcp"  # https
    volumes:
      - /home/iurii/docker/jellyfin/config:/config
      - /home/iurii/docker/jellyfin/cache:/cache
      - type: bind
        source: /mnt/data/jellyfin
        target: /media
        read_only: true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - 'host.docker.internal:host-gateway'