---
# Reference https://docs.speedtest-tracker.dev/getting-started/installation

services:
    speedtest-tracker:
        image: lscr.io/linuxserver/speedtest-tracker:latest
        restart: unless-stopped
        container_name: speedtest-tracker
        security_opt:
            - no-new-privileges:true
        ports:
            - 127.0.0.1:8081:80
            # - 127.0.0.1:8443:443  # https
        healthcheck:
            test: ["CMD-SHELL","curl -f http://localhost:80 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        env_file:
            - .env
        volumes:
            - /home/iurii/docker/speedtest-tracker/config:/config
        logging:
            options:
                max-size: 10m
                max-file: "3"
        networks:
          - shared

networks:
  shared:
    external: true