# https://github.com/dani-garcia/vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vaultwarden.iurii.io"
    volumes:
      - /home/iurii/docker/vaultwarden/vw-data/:/data/
    ports:
      - 127.0.0.1:3005:80