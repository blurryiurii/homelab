# https://github.com/syncthing/syncthing/blob/main/README-Docker.md
---
services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    entrypoint: ["/bin/syncthing"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    user: "0:0"
    environment:
      - TZ=America/Chicago
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - /home/iurii/docker/syncthing/data:/var/syncthing/config
      - /mnt/data:/mnt/data
      - /mnt/data/All Media/Camera:/mnt/Camera
      - /home/iurii/Documents:/mnt/Documents
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL","curl -f http://127.0.0.1:8384/rest/noauth/health | grep -o OK || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - shared

networks:
  shared:
    external: true