# https://github.com/FreshRSS/FreshRSS/tree/edge/Docker

---
services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Chicago
      # - TRUSTED_PROXY=172.16.0.1/12
    volumes:
      - /home/iurii/docker/freshrss/data:/var/www/FreshRSS/data
    ports:
      - 127.0.0.1:3004:80
    logging:
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3