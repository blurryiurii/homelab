# https://github.com/FreshRSS/FreshRSS/tree/edge/Docker

---
services:
  freshrss:
    image: freshrss/freshrss:edge
    container_name: freshrss
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # - TRUSTED_PROXY=172.16.0.1/12
    volumes:
      - /home/iurii/docker/freshrss/data:/var/www/FreshRSS/data
    ports:
      - 127.0.0.1:3004:80
    logging:
      options:
        max-size: 10m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
